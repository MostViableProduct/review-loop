name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      # As in ci.yml: the suite's time-budget tests are tuned for a developer machine; shared runners are slower.
      TEST_CONCURRENCY: 2
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
      formula: ${{ steps.tarball.outputs.formula }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # The write token never lands in .git/config: only the two steps that write (release, plugin tag) get it.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Tag, CLI, plugin and marketplace versions are equal
        # release-check also refuses a tag that isn't X.Y.Z, so the version below is safe in paths and sed.
        run: node scripts/release-check.mjs "${GITHUB_REF_NAME#v}"
      - name: The tagged commit is on main (spec §9, releases come only from main)
        run: git merge-base --is-ancestor HEAD origin/main
      # After the main check. The signer list is origin/main's current one, never the tagged commit's: an older commit
      # on main may still list a key that has since been removed.
      - name: The tag is signed by the release key in docs/allowed_signers
        shell: bash
        run: |
          set -euo pipefail
          TAG="refs/tags/${GITHUB_REF_NAME}"
          # The checkout may hold only a lightweight ref for the pushed tag; fetch the tag object, which carries the signature.
          git fetch -q --force --no-tags origin "+${TAG}:${TAG}"
          if [ "$(git cat-file -t "$TAG")" != tag ]; then echo "release: ${GITHUB_REF_NAME} is not an annotated tag, so it has no signature" >&2; exit 1; fi
          if [ "$(git rev-parse "${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then echo "release: ${GITHUB_REF_NAME} no longer points at the checked-out commit" >&2; exit 1; fi
          SIGNERS="$(mktemp)"
          git show origin/main:docs/allowed_signers > "$SIGNERS"
          PRINCIPAL="$(awk 'NF { print $1; exit }' "$SIGNERS")"
          if ! OUT="$(git -c gpg.ssh.allowedSignersFile="$SIGNERS" verify-tag "$TAG" 2>&1)"; then
            printf '%s\n' "$OUT" >&2; echo "release: ${GITHUB_REF_NAME} is not signed by a key in main's docs/allowed_signers" >&2; exit 1
          fi
          # The principal by name too, so a key the file doesn't list never passes on any git version's exit status.
          if ! printf '%s\n' "$OUT" | grep -qF "Good \"git\" signature for ${PRINCIPAL} "; then
            printf '%s\n' "$OUT" >&2; echo "release: ${GITHUB_REF_NAME} is not signed as ${PRINCIPAL}" >&2; exit 1
          fi
          printf '%s\n' "$OUT"
      # The private denylist (docs/RELEASE.md) reaches only the gate steps, and --require-private fails the job when
      # the secret is empty or missing: a release never ships on the generic rules alone.
      - name: Content gate (packaged set, generic and private rules)
        env:
          CONTENT_GATE_DENYLIST: ${{ secrets.CONTENT_GATE_DENYLIST }}
        run: node scripts/content-gate.mjs --require-private
      - name: Content gate (every tracked file, private rules)
        env:
          CONTENT_GATE_DENYLIST: ${{ secrets.CONTENT_GATE_DENYLIST }}
        run: node scripts/content-gate.mjs --tracked --require-private
      - run: npm test
      - run: npm run sabotage
      - name: Build the tarball from the allowlisted set, then re-gate it
        id: tarball
        shell: bash
        env:
          CONTENT_GATE_DENYLIST: ${{ secrets.CONTENT_GATE_DENYLIST }}
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          # Its own statement, never inline in git archive's arguments: a failing or empty list there would archive
          # the whole of HEAD. Under set -e a failed substitution in an assignment stops the step.
          FILES="$(node scripts/content-gate.mjs --list)"
          if [ -z "$FILES" ]; then echo "release: content-gate --list printed no files; refusing to build" >&2; exit 1; fi
          # One path per line: split on newlines only, with globbing off.
          IFS=$'\n'; set -f
          git archive --format=tar.gz --prefix="review-loop-$V/" -o "review-loop-$V.tar.gz" HEAD $FILES
          set +f; unset IFS
          mkdir extracted && tar -xzf "review-loop-$V.tar.gz" -C extracted
          diff <(printf '%s\n' "$FILES" | LC_ALL=C sort) <(cd "extracted/review-loop-$V" && find . -type f | sed 's#^\./##' | LC_ALL=C sort)
          node scripts/content-gate.mjs --dir "extracted/review-loop-$V" --require-private
          SHA="$(shasum -a 256 "review-loop-$V.tar.gz" | cut -d' ' -f1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          # The tap's formula, naming this archive: tap-formula refuses a placeholder or malformed sha256, which no
          # Homebrew install could ever pass. Handed to tap-bump, which has no checkout of this repo.
          node scripts/tap-formula.mjs "$V" "$SHA" > "$RUNNER_TEMP/review-loop.rb"
          echo "formula=$(base64 < "$RUNNER_TEMP/review-loop.rb" | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        # Created once. A rerun after a later step failed finds the release and requires its archive to be this build,
        # byte for byte: the tap formula names this sha256, so a release carrying any other archive could never install.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.tarball.outputs.version }}
          SHA: ${{ steps.tarball.outputs.sha256 }}
        run: |
          set -euo pipefail
          A="review-loop-$V.tar.gz"
          if ! gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null; then
            gh release create "$GITHUB_REF_NAME" "$A" --verify-tag --title "review-loop $V" --generate-notes
            exit 0
          fi
          P="$RUNNER_TEMP/published"
          rm -rf "$P" && mkdir "$P"
          if gh release download "$GITHUB_REF_NAME" --pattern "$A" --dir "$P" && [ -f "$P/$A" ]; then
            GOT="$(shasum -a 256 "$P/$A" | cut -d' ' -f1)"
            if [ "$GOT" != "$SHA" ]; then
              echo "::error::release $GITHUB_REF_NAME already carries a different $A (sha256 $GOT; this build is $SHA). Delete that release, then re-run this workflow" >&2
              exit 1
            fi
            echo "release $GITHUB_REF_NAME is already published with this archive; continuing"
          else
            # Without --clobber an asset that is there after all (a failed download) makes this fail, never replace it.
            gh release upload "$GITHUB_REF_NAME" "$A"
          fi
      - name: Install the pinned Claude Code CLI (no token here; npm install scripts could read one)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.285
          git config user.name "review-loop release"
          git config user.email "release@example.com"
      - name: Plugin tag (validates plugin.json against the marketplace entry)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.tarball.outputs.version }}
        run: |
          set -euo pipefail
          # The push inside `claude plugin tag --push` authenticates through git config read from the environment:
          # never in a URL, argv or .git/config.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          # `claude plugin tag` names the tag {name}--v{version}. A rerun after a later failure finds it pushed: done when
          # it names this commit, and never moved when it names another.
          TAG="review-loop--v$V"
          # Both patterns: ls-remote matches a ref by its tail, so "$TAG" alone never returns the peeled "$TAG^{}" line.
          REFS="$(git ls-remote --tags origin "$TAG" "$TAG^{}")"
          AT="$(printf '%s\n' "$REFS" | awk -v t="refs/tags/$TAG^{}" '$2 == t { print $1 }')"
          [ -n "$AT" ] || AT="$(printf '%s\n' "$REFS" | awk -v t="refs/tags/$TAG" '$2 == t { print $1 }')"
          if [ -z "$AT" ]; then
            claude plugin tag plugin --push
          elif [ "$AT" = "$(git rev-parse HEAD)" ]; then
            echo "plugin tag $TAG is already pushed at this commit; continuing"
          else
            echo "::error::plugin tag $TAG already exists at $AT, not at this release's commit; it is never moved" >&2
            exit 1
          fi
  tap-bump:
    # The only job that can read TAP_PR_TOKEN (spec §9): it lives in the `release` environment, which requires a
    # reviewer's approval before this job starts. The repo's own GITHUB_TOKEN gets no scopes here.
    needs: release
    runs-on: macos-14
    timeout-minutes: 15
    environment: release
    permissions: {}
    steps:
      - name: Open the tap PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TAP_PR_TOKEN }}
          V: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha256 }}
          FORMULA: ${{ needs.release.outputs.formula }}
        run: |
          set -euo pipefail
          # Clone and push authenticate through git config read from the environment: never in a URL, argv or
          # .git/config. `gh` reads GH_TOKEN itself.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH"
          git clone "https://github.com/MostViableProduct/homebrew-tap.git" tap
          cd tap
          B="review-loop-$V"
          # Written whole from the release job's tap-formula output: the tap holds no formula before the first release.
          F=Formula/review-loop.rb
          mkdir -p Formula
          printf '%s' "$FORMULA" | base64 -d > "$F"
          grep -qx "  sha256 \"$SHA\"" "$F" || { echo "::error::the formula does not carry this release's sha256" >&2; exit 1; }
          # A rerun after the PR step failed finds the branch pushed: reused only when it carries this exact formula.
          if [ -n "$(git ls-remote --heads origin "$B")" ]; then
            git fetch -q origin "refs/heads/$B:refs/remotes/origin/$B"
            git show "origin/$B:$F" | cmp -s - "$F" || { echo "::error::tap branch $B already exists with a different formula; delete it, then re-run tap-bump" >&2; exit 1; }
            echo "tap branch $B is already pushed with this formula; continuing"
          else
            git checkout -b "$B"
            git add "$F"
            git -c user.name="review-loop release" -c user.email="release@example.com" commit -m "review-loop $V"
            git push origin "$B"
          fi
          if [ -n "$(gh pr list --repo MostViableProduct/homebrew-tap --head "$B" --state all --json number --jq '.[].number')" ]; then
            echo "a tap PR for $B already exists; nothing to open"
          else
            gh pr create --repo MostViableProduct/homebrew-tap --head "$B" --title "review-loop $V" --body "Automated bump to v$V (sha256 $SHA)."
          fi
