name: sabotage
# The two `paths` lists are the same list: push covers this repo's branches, pull_request covers PRs (forks included).
# test/contract/sabotage-registry.test.mjs fails when a registry file or gate test is missing from either.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "plugin/engine/lib/events.mjs"
      - "plugin/engine/lib/config.mjs"
      - "plugin/engine/lib/codexcfg.mjs"
      - "plugin/hooks/hooks.json"
      - "plugin/engine/lib/merge.mjs"
      - "plugin/engine/review-round.mjs"
      - "plugin/engine/lib/pin.mjs"
      - "plugin/engine/lib/fsutil.mjs"
      - "cli/review-loop.mjs"
      - "cli/lib/settings.mjs"
      - "cli/lib/setup.mjs"
      - "cli/lib/doctor.mjs"
      - "cli/lib/migrate.mjs"
      - "scripts/content-gate.mjs"
      - "scripts/sabotage-registry.mjs"
      - "scripts/sabotage.mjs"
      - "package.files.json"
      - "scripts/release-check.mjs"
      - "scripts/bump-version.mjs"
      - ".github/workflows/release.yml"
      - "homebrew-tap/Formula/review-loop.rb"
      # The gate tests: a test edited to keep its name but lose its assertion re-runs the sabotage it must catch.
      - "test/contract/events.test.mjs"
      - "test/contract/content-discipline.test.mjs"
      - "test/contract/codes.test.mjs"
      - "test/engine/model-effort.test.mjs"
      - "test/contract/shape.test.mjs"
      - "test/engine/merge.test.mjs"
      - "test/cli/skeleton.test.mjs"
      - "test/cli/settings.test.mjs"
      - "test/cli/setup.test.mjs"
      - "test/cli/doctor.test.mjs"
      - "test/cli/migrate.test.mjs"
      - "test/contract/content-gate.test.mjs"
      - "test/cli/mainguard.test.mjs"
      - "test/contract/release.test.mjs"
      - "test/engine/broker.test.mjs"
      - "test/engine/fsutil.test.mjs"
      - "test/contract/sabotage-registry.test.mjs"
      - "test/contract/no-bare-exit.test.mjs"
  pull_request:
    paths:
      - "plugin/engine/lib/events.mjs"
      - "plugin/engine/lib/config.mjs"
      - "plugin/engine/lib/codexcfg.mjs"
      - "plugin/hooks/hooks.json"
      - "plugin/engine/lib/merge.mjs"
      - "plugin/engine/review-round.mjs"
      - "plugin/engine/lib/pin.mjs"
      - "plugin/engine/lib/fsutil.mjs"
      - "cli/review-loop.mjs"
      - "cli/lib/settings.mjs"
      - "cli/lib/setup.mjs"
      - "cli/lib/doctor.mjs"
      - "cli/lib/migrate.mjs"
      - "scripts/content-gate.mjs"
      - "scripts/sabotage-registry.mjs"
      - "scripts/sabotage.mjs"
      - "package.files.json"
      - "scripts/release-check.mjs"
      - "scripts/bump-version.mjs"
      - ".github/workflows/release.yml"
      - "homebrew-tap/Formula/review-loop.rb"
      - "test/contract/events.test.mjs"
      - "test/contract/content-discipline.test.mjs"
      - "test/contract/codes.test.mjs"
      - "test/engine/model-effort.test.mjs"
      - "test/contract/shape.test.mjs"
      - "test/engine/merge.test.mjs"
      - "test/cli/skeleton.test.mjs"
      - "test/cli/settings.test.mjs"
      - "test/cli/setup.test.mjs"
      - "test/cli/doctor.test.mjs"
      - "test/cli/migrate.test.mjs"
      - "test/contract/content-gate.test.mjs"
      - "test/cli/mainguard.test.mjs"
      - "test/contract/release.test.mjs"
      - "test/engine/broker.test.mjs"
      - "test/engine/fsutil.test.mjs"
      - "test/contract/sabotage-registry.test.mjs"
      - "test/contract/no-bare-exit.test.mjs"
permissions:
  contents: read
concurrency:
  group: sabotage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sabotage:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22.x"
      - run: npm run sabotage
